<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Success</title>
  <link rel="stylesheet" href="./order-success.css">
</head>
<body>
  <main class="success-page">
    <section class="success-card" aria-labelledby="success-title">
      <p class="status-pill">Order Confirmed</p>
      <h1 id="success-title">Thank you for your purchase!</h1>
      <p class="subtitle">
        Your payment was successful and your order is being prepared.
      </p>

      <div class="meta-grid">
        <div class="meta-block">
          <span class="meta-label">Order Number</span>
          <strong id="order-id">-</strong>
        </div>
        <div class="meta-block">
          <span class="meta-label">Order Date</span>
          <strong id="order-date">-</strong>
        </div>
      </div>

      <section class="summary" aria-labelledby="summary-title">
        <h2 id="summary-title">Order Summary</h2>

        <ul id="order-items" class="order-items" aria-live="polite"></ul>

        <div class="totals">
          <div class="total-row">
            <span>Subtotal</span>
            <strong id="subtotal">$0.00</strong>
          </div>
          <div class="total-row">
            <span>Shipping</span>
            <strong id="shipping">$0.00</strong>
          </div>
          <div class="total-row">
            <span>Tax</span>
            <strong id="tax">$0.00</strong>
          </div>
          <div class="total-row grand-total">
            <span>Total</span>
            <strong id="total">$0.00</strong>
          </div>
        </div>
      </section>

      <div class="actions">
        <a class="btn btn-primary" href="/">Continue Shopping</a>
        <a class="btn btn-secondary" href="/orders">View Orders</a>
      </div>

      <p id="clear-cart-status" class="sr-status" aria-live="polite"></p>
    </section>
  </main>

  <script src="./order-success.js" defer></script>
</body>
</html>
